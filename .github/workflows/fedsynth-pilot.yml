name: FedSynthCT Li ONNX three-case technical pilot

on:
  push:
    branches: [fedsynth-meta-reanalysis]
    paths:
      - '.github/workflows/fedsynth-pilot.yml'
      - 'fedsynth_meta/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out versioned reanalysis branch
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ZIP64 range reader
        run: npm install --no-save @gyng/remote-zip@1.0.1

      - name: Extract one paired Task1 brain case per anonymous center
        run: node fedsynth_meta/extract_cases.mjs data/pilot

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.1.3' \
            'scipy==1.14.1' \
            'pandas==2.2.3' \
            'matplotlib==3.9.2' \
            'scikit-image==0.24.0' \
            'SimpleITK==2.4.0' \
            'onnx==1.17.0' \
            'onnxruntime==1.20.1'

      - name: Download and verify the official Li ONNX model
        run: |
          mkdir -p models
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://github.com/ciroraggio/SlicerModalityConverter/releases/download/models/fedsynthct_lietal_t1w_brain.onnx' \
            -o models/fedsynthct_lietal_t1w_brain.onnx
          echo '52837d959b844bf83664d7e1e575d1a5f8cfbbec29bf1d52f3e59cc688d99fda  models/fedsynthct_lietal_t1w_brain.onnx' | sha256sum -c -

      - name: Run the new versioned three-case technical pilot
        run: |
          rm -rf outputs/pilot
          python fedsynth_meta/scripts/pilot.py \
            --data data/pilot \
            --model models/fedsynthct_lietal_t1w_brain.onnx \
            --out outputs/pilot

      - name: Add public 3D Slicer interface screenshot
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/ciroraggio/SlicerModalityConverter/main/ModalityConverter/assets/ScreenshotUI.png' \
            -o outputs/pilot/figures/SlicerModalityConverter_UI.png

      - name: Write checksums and file inventory
        run: |
          find outputs/pilot -type f -print0 | sort -z | xargs -0 sha256sum > outputs/pilot/SHA256SUMS.txt
          find outputs/pilot -type f -printf '%P\t%s bytes\n' | sort > outputs/pilot/FILE_INVENTORY.txt
          cp data/pilot/extraction_manifest.json outputs/pilot/

      - name: Upload complete technical-pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedsynth-li-three-case-technical-pilot
          path: outputs/pilot
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
