name: FedSynthCT controlled input-shift stress tests

on:
  push:
    branches: [fedsynth-meta-reanalysis]
    paths:
      - '.github/workflows/fedsynth-stress.yml'
  workflow_dispatch:

concurrency:
  group: fedsynth-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANALYSIS_PROTOCOL_VERSION: 'v1.2.0-official-mask'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        center: [A,B,C]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q fedsynth_meta/scripts fedsynth_full fedsynth_stress
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save @gyng/remote-zip@1.0.1
      - name: Extract six deterministic paired cases with resilient retries
        run: node fedsynth_full/extract_chunk.mjs '${{ matrix.center }}' 0 6 data/stress
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'pandas==2.2.3' 'matplotlib==3.9.2' 'scikit-image==0.24.0' 'SimpleITK==2.4.0' 'onnx==1.17.0' 'onnxruntime==1.20.1'
      - name: Download and verify official Li ONNX
        run: |
          mkdir -p models
          curl --fail --location --retry 5 --retry-delay 5 'https://github.com/ciroraggio/SlicerModalityConverter/releases/download/models/fedsynthct_lietal_t1w_brain.onnx' -o models/li.onnx
          echo '52837d959b844bf83664d7e1e575d1a5f8cfbbec29bf1d52f3e59cc688d99fda  models/li.onnx' | sha256sum -c -
      - name: Run model-space stress tests
        run: |
          mkdir -p outputs/stress_${{ matrix.center }}
          python fedsynth_stress/stress_worker.py --data data/stress --model models/li.onnx --out outputs/stress_${{ matrix.center }}
          find outputs/stress_${{ matrix.center }} -type f -print0 | sort -z | xargs -0 sha256sum > outputs/stress_${{ matrix.center }}/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fedsynth-stress-${{ matrix.center }}
          path: outputs/stress_${{ matrix.center }}
          retention-days: 30
          if-no-files-found: error
